server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API (optional)
    location /api/ {
        proxy_pass http://backend:5003;
        proxy_set_header Host $host;
    }
}
